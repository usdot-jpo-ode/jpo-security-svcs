name: CI
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [develop, master]
    
jobs:
  jpo-security-svcs:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine
      options: --user root
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
      - name: Install build dependencies
        run: apk add --no-cache git maven
      - name: Build and Run Tests
        run: |
          cd $GITHUB_WORKSPACE/jpo-security-svcs
          mvn -e clean verify
      - name: Archive code coverage results
        uses: actions/upload-artifact@v6
        with:
          name: jpo-security-svcs
          path: jpo-security-svcs/target
          if-no-files-found: error

  mock-signing-svc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/mock-signing-svc
          ./mvnw -e clean package

  tmca-tester:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "18.x"
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/tmca-tester
          npm install --force
          node ./tmca-tester.js

  sonar:
    needs: [jpo-security-svcs, mock-signing-svc, tmca-tester]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download code coverage results
        uses: actions/download-artifact@v7
        with:
          name: jpo-security-svcs
          path: jpo-security-svcs/target
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd jpo-security-svcs
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=usdot-jpo-ode \
            -Dsonar.projectKey=usdot-jpo-ode_jpo-security-svcs \
            -Dsonar.projectName=jpo-security-svcs \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.token=$SONAR_TOKEN